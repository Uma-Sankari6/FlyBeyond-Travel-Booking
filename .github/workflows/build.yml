
name: Build and Deploy FlyBeyond

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:

  build:
    name: Build FlyBeyond
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and Test with Maven
        run: mvn clean verify

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: war-file
          path: target/*.war
          if-no-files-found: error

  deploy-dev:
    name: Deploy to DEV
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: war-file

      - name: Deploy to DEV
        env:
          URL: ${{ secrets.DEV_TOMCAT_URL }}
          USER: ${{ secrets.DEV_TOMCAT_USERNAME }}
          PASS: ${{ secrets.DEV_TOMCAT_PASSWORD }}
        run: |
          WAR_FILE=$(ls *.war | head -n 1)
          echo "Deploying $WAR_FILE to DEV"
          curl -u "$USER:$PASS" --fail -T "$WAR_FILE" \
            "$URL/deploy?path=/FlyBeyond&update=true"

  deploy-test:
    name: Deploy to TEST
    needs: deploy-dev
    runs-on: ubuntu-latest

    steps:
      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: war-file

      - name: Deploy to TEST
        env:
          URL: ${{ secrets.TEST_TOMCAT_URL }}
          USER: ${{ secrets.TEST_TOMCAT_USERNAME }}
          PASS: ${{ secrets.TEST_TOMCAT_PASSWORD }}
        run: |
          WAR_FILE=$(ls *.war | head -n 1)
          echo "Deploying $WAR_FILE to TEST"
          curl -u "$USER:$PASS" --fail -T "$WAR_FILE" \
            "$URL/deploy?path=/FlyBeyond&update=true"

  deploy-pre-prod:
    name: Deploy to PRE-PROD
    needs: deploy-test
    runs-on: ubuntu-latest

    steps:
      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: war-file

      - name: Deploy to PRE-PROD
        env:
          URL: ${{ secrets.PREPROD_TOMCAT_URL }}
          USER: ${{ secrets.PREPROD_TOMCAT_USERNAME }}
          PASS: ${{ secrets.PREPROD_TOMCAT_PASSWORD }}
        run: |
          WAR_FILE=$(ls *.war | head -n 1)
          echo "Deploying $WAR_FILE to PRE-PROD"
          curl -u "$USER:$PASS" --fail -T "$WAR_FILE" \
            "$URL/deploy?path=/FlyBeyond&update=true"

  deploy-prod:
    name: Deploy to PROD
    needs: deploy-pre-prod
    runs-on: ubuntu-latest

    steps:
      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: war-file

      - name: Deploy to PROD
        env:
          URL: ${{ secrets.PROD_TOMCAT_URL }}
          USER: ${{ secrets.PROD_TOMCAT_USERNAME }}
          PASS: ${{ secrets.PROD_TOMCAT_PASSWORD }}
        run: |
          WAR_FILE=$(ls *.war | head -n 1)
          echo "Deploying $WAR_FILE to PROD"
          curl -u "$USER:$PASS" --fail -T "$WAR_FILE" \
            "$URL/deploy?path=/FlyBeyond&update=true"
