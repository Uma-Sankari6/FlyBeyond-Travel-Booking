
name: Build Pipeline

on:
  push:
    branches:
      - dev
      - test
      - pre-prod
      - prod

  pull_request:
    branches:
      - dev
      - test
      - pre-prod
      - prod

jobs:
  build:
    name: Maven Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build Application
        run: mvn clean package
